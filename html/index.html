<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowgrave GIF 生成器</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
  <h1>❄ Snowgrave GIF 生成器</h1>

  <div class="form">
    <label class="label">上传头像图片</label>
    <input type="file" id="file-input" class="file-input" accept="image/*">
    <button id="gen" class="btn-primary">生成 GIF</button>
  </div>

  <div class="preview-box">
    <img id="out" alt="" style="display:none">
    <div id="empty-tip">生成后的 GIF 会显示在这里</div>
  </div>

  <a id="dl" class="btn-download" download="snowgrave.gif" style="display:none">
    ⬇ 下载 GIF
  </a>

  <div id="status"></div>
</div>

<script src="./api.js"></script>
<script src="./main.js"></script>
</body>
</html>
